context:
  version: "40.0.1"

package:
  name: fx
  version: ${{ version }}

source:
  url: https://github.com/antonmedv/fx/archive/${{ version }}.tar.gz
  sha256: 311ca3f2ac2fe951c1f662b52e9fbf5ceeed74a2b7c52e8aa98c30001c2ffbb2

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - fx -v

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Terminal JSON viewer
  homepage: https://github.com/antonmedv/fx
  repository: https://github.com/antonmedv/fx

extra:
  recipe-maintainers:
    - danielnachun
