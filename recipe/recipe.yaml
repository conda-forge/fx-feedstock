context:
  version: "40.0.2"

package:
  name: fx
  version: ${{ version }}

source:
  url: https://github.com/antonmedv/fx/archive/${{ version }}.tar.gz
  sha256: 1bfb6664c0adba8ff12618e7dd9334921f3c9e5e41c7724027c0949fce826347

build:
  number: 0

requirements:
  build:
    - ${{ compiler('go-nocgo') }}
    - go-licenses

tests:
  - script:
      - fx -v

about:
  license: MIT
  license_file:
    - LICENSE
    - license-files/
  summary: Terminal JSON viewer
  homepage: https://github.com/antonmedv/fx
  repository: https://github.com/antonmedv/fx

extra:
  recipe-maintainers:
    - danielnachun
